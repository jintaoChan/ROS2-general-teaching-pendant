# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mode_controller:
      type: control_pad/ControlPadController


joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster


trajectory_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - joint0
      - joint1
      - joint2
      - joint3
      - joint4
    command_interfaces:
      - position
      # - velocity
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    # gains:
    #   joint0:
    #     p: 10.0
    #     i: 1.0
    #     d: 1.0
    #     i_clamp: 1.0
    #     ff_velocity_scale: 1.0
    #   joint1:
    #     p: 10.0
    #     i: 1.0
    #     d: 1.0
    #     i_clamp: 1.0
    #     ff_velocity_scale: 1.0
    #   joint2:
    #     p: 10.0
    #     i: 1.0
    #     d: 1.0
    #     i_clamp: 1.0
    #     ff_velocity_scale: 1.0
    #   joint3:
    #     p: 10.0
    #     i: 1.0
    #     d: 1.0
    #     i_clamp: 1.0
    #     ff_velocity_scale: 1.0
    #   joint4:
    #     p: 10.0
    #     i: 1.0
    #     d: 1.0
    #     i_clamp: 1.0
    #     ff_velocity_scale: 1.0

mode_controller:
  ros__parameters:
    type: control_pad/ControlPadController

    mode:
      default: 8
      position: 8
      velocity: 9

    # command_interfaces:
      # - position
      # - velocity
      # - mode
    state_interfaces:
      - position
      - velocity
      # - mode
    joints:
      - joint0
      - joint1
      - joint2
      - joint3
      - joint4

