
vendor_id: 0x00010203
product_id: 0x00000402 # Product code
assign_activate: 0x0300 # DC Synch register
auto_fault_reset: false # true = automatic fault reset, false = fault reset on rising edge command interface "reset_fault"
rpdo:
  - index: 0x1600
    channels:
      - { index: 0x6060, sub_index: 0, type: int8, command_interface: mode, default: 8}  # Mode of operation
      - { index: 0x6040, sub_index: 0, type: uint16, command_interface: control_word, default: 0 } # Control word
      - { index: 0x607a, sub_index: 0, type: int32, command_interface: position, factor: 16855491.414360251603518499, offset: -26490173, default: .nan} # Target position
      - { index: 0x6071, sub_index: 0, type: int16, command_interface: effort, factor: 7.518796992481203008, default: 0}  # Target torque
tpdo:
  - index: 0x1a02
    channels:
      - { index: 0x6041, sub_index: 0, type: uint16, state_interface: status_word } # Status word
      - { index: 0x6061, sub_index: 0, type: int8, state_interface: mode}  # Mode of operation display
      - { index: 0x6064, sub_index: 0, type: int32, factor: 0.000000059327846066, offset: 1.571604899004072, state_interface: position } # Position actual value
      - { index: 0x606c, sub_index: 0, type: int32, factor: 0.000000059327846066, state_interface: velocity }  # Velocity actual value
      - { index: 0x6077, sub_index: 0, type: int16, factor: 0.133, state_interface: effort}  # Torque actual value
