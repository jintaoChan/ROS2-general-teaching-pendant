vendor_id: 0x00010203
product_id: 0x00000402 # Product code
assign_activate: 0x0300 # DC Synch register
auto_fault_reset: false # true = automatic fault reset, false = fault reset on rising edge command interface "reset_fault"
rpdo:
  - index: 0x1600
    channels:
      - { index: 0x6060, sub_index: 0, type: int8, command_interface: mode, default: 8}  # Mode of operation
      - { index: 0x6040, sub_index: 0, type: uint16, command_interface: control_word, default: 0 } # Control word
      - { index: 0x607a, sub_index: 0, type: int32, command_interface: position, factor: 8511188.733983889423558846, offset: 411322, default: .nan} # Target position
      - { index: 0x6071, sub_index: 0, type: int16, command_interface: effort, factor: 31.25, default: 0}  # Target torque
tpdo:
  - index: 0x1a02
    channels:
      - { index: 0x6041, sub_index: 0, type: uint16, state_interface: status_word } # Status word
      - { index: 0x6061, sub_index: 0, type: int8, state_interface: mode}  # Mode of operation display
      - { index: 0x6064, sub_index: 0, type: int32, factor: 0.000000117492401033, offset: -0.048327209377657607, state_interface: position } # Position actual value
      - { index: 0x606c, sub_index: 0, type: int32, factor: 0.000000117492401033, state_interface: velocity }  # Velocity actual value
      - { index: 0x6077, sub_index: 0, type: int16, factor: 0.032, state_interface: effort}  # Torque actual value
