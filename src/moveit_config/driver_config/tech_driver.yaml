
# Configuration file for Maxon EPOS4 50/5 drive
vendor_id: 0x0000009a
product_id: 0x00030924 # Product code
assign_activate: 0x0300 # DC Synch register
auto_fault_reset: true # true = automatic fault reset, false = fault reset on rising edge command interface "reset_fault"
# sdo: # sdo data to be transferred at drive startup
#   - { index: 0x60C2, sub_index: 1, type: int8, value: 10 } # Set interpolation time for cyclic modes to 10 ms
#   - { index: 0x60C2, sub_index: 2, type: int8, value: -3 } # Set base 10-3s
rpdo: # RxPDO = receive PDO 4 Mapping
  - index: 0x1607
    channels:
      - { index: 0x6060, sub_index: 0, type: int8, default: 8}  # Mode of operation
      - { index: 0x6040, sub_index: 0, type: uint16, default: 0 } # Control word
      - { index: 0x607a, sub_index: 0, type: int32, command_interface: position, factor: 20860.756700941, default: .nan} # Target position
      - { index: 0x60ff, sub_index: 0, type: int32, command_interface: velocity, factor: 20860.756700941, default: 0}  # Target velocity
tpdo: # TxPDO = transmit PDO 4 Mapping
  - index: 0x1a07
    channels:
      - { index: 0x6041, sub_index: 0, type: uint16 } # Status word
      - { index: 0x6061, sub_index: 0, type: int8}  # Mode of operation display
      - { index: 0x6064, sub_index: 0, type: int32, factor: 0.000047937, state_interface: position } # Position actual value
      - { index: 0x606c, sub_index: 0, type: int32, factor: 0.000047937, state_interface: velocity }  # Velocity actual value
      - { index: 0x603f, sub_index: 0, type: uint16}  # Error code
      - { index: 0x6077, sub_index: 0, type: int16, state_interface: effort}  # Torque actual value
      # - { index: 0x60b9, sub_index: 0, type: uint16, default: 0}  # Touch Probe status
      # - { index: 0x60ba, sub_index: 0, type: int32, default: 0}  # Touch probe pos1 pos value
      # - { index: 0x60bb, sub_index: 0, type: int32, default: 0}  # Touch probe pos1 neg value
      # - { index: 0x60bc, sub_index: 0, type: int32, default: 0}  # Touch probe pos1 pos value
      # - { index: 0x60bd, sub_index: 0, type: int32, default: 0}  # Touch probe pos1 neg value