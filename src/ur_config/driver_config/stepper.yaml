# Configuration file for Tech drive
vendor_id: 0x00000A88
product_id: 0x0A880002
assign_activate: 0x0300  # DC Synch register
auto_fault_reset: true  # true = automatic fault reset, false = fault reset on rising edge command interface "reset_fault"
# sdo:  # sdo data to be transferred at drive startup
#   - {index: 0x60C2, sub_index: 1, type: int8, value: 10} # Set interpolation time for cyclic modes to 10 ms
#   - {index: 0x60C2, sub_index: 2, type: int8, value: -3} # Set base 10-3s
rpdo:  # RxPDO = receive PDO Mapping
  - index: 0x1600
    channels:
      - {index: 0x6040, sub_index: 0, type: uint16, default: 0}  # Control word
      - {index: 0x6060, sub_index: 0, type: int8, command_interface: mode, default: 8}  # Mode of operation
      - {index: 0x607a, sub_index: 0, type: int32, command_interface: position, factor: 500000, default: .nan}  # Target position   
      - {index: 0x60ff, sub_index: 0, type: int32, command_interface: velocity, factor: 500000, default: 0}  # Target velocity
tpdo:  # TxPDO = transmit PDO Mapping
  - index: 0x1a00
    channels:
      - {index: 0x6041, sub_index: 0, type: uint16}  # Status word
      - {index: 0x6061, sub_index: 0, type: int8, state_interface: mode}  # Mode of operation display
      - {index: 0x6064, sub_index: 0, type: int32, factor: 0.000002, state_interface: position}  # Position actual value
      - {index: 0x606c, sub_index: 0, type: int32, factor: 0.000002, state_interface: velocity}  # Velocity actual value